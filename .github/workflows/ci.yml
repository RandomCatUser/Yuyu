name: CI

# The gate. Three independent jobs, so a lint failure never hides a test
# failure and neither hides a boot failure. The fastest job reports first.
#
# Every failing job writes a job summary (.github/scripts/ci_report.py) before
# it fails, because the default output for a genuinely broken build is a wall of
# text that scrolls past the two numbers you actually wanted.

# Main only. A push to main plus a manual trigger is the whole surface - no
# pull_request trigger, no staging branch, nothing that fans out into branches.
# The PR bot lives separately in pr.yml, which does labels and title checks and
# deliberately does not run this suite.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # The rule set lives in ruff.toml at the repo root, not here - so local
      # runs and CI enforce exactly the same thing, and it cannot drift when
      # ruff changes its defaults between releases. Currently E9/F63/F7/F82:
      # syntax errors and undefined names, i.e. defects rather than style.
      #
      # continue-on-error so the summary below still runs; a later step
      # re-raises the failure, so the job is still red.
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check --no-cache --output-format=github .

      - name: Summarise findings
        if: always()
        run: |
          ruff check --no-cache --output-format=concise . > "$RUNNER_TEMP/ruff.log" || true
          python .github/scripts/ci_report.py ruff --log "$RUNNER_TEMP/ruff.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when Ruff failed
        if: steps.ruff.outcome == 'failure'
        run: |
          echo "::error::Ruff reported undefined names or syntax errors - see the job summary."
          exit 1

      # Advisory only: this project has never been reformatted wholesale, and a
      # style diff should not hold up a build. It stays visible as a warning.
      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Any failing version is enough to fail the run. The others keep going so
      # one report shows every broken version, not just the first.
      fail-fast: false
      matrix:
        # README requires 3.11+. 3.11 stays in the matrix on purpose: it is the
        # floor the project supports, so it must not rot.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # No provider keys are configured on purpose. The offline suite must pass
      # with zero secrets, and test_live.py skips itself unless
      # LLM_LIVE_TESTS=1. If a test starts needing a key to pass, it is testing
      # the wrong thing and this is where that gets caught.
      #
      # --tb=short keeps a trace usable; --junitxml feeds the summary; a failing
      # run does not stop the summary from running.
      - name: Offline test suite
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -q --tb=short -rfE --junitxml="$RUNNER_TEMP/junit.xml"

      - name: Summarise results
        if: always()
        run: |
          python .github/scripts/ci_report.py pytest --junit "$RUNNER_TEMP/junit.xml" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Offline test suite failed - see the job summary for failures grouped by cause."
          exit 1

      # tests/test_dashboard.py syntax-checks the dashboard's inline module by
      # shelling out to `node --check` and skips when node is absent. ubuntu
      # runners have node preinstalled, so that check actually runs here rather
      # than silently skipping.
      - name: Confirm the node-gated check is running, not silently skipping
        if: always()
        run: |
          node --version
          python -m pytest tests/test_dashboard.py -q -k script_parses -rs

  boot-check:
    name: Boot (import + config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # Cheapest end-to-end signal that the app can actually be imported with a
      # blank .env. main.py talks to Discord on import, so every module is
      # imported directly instead.
      - name: Import every module
        id: imports
        continue-on-error: true
        run: |
          cp .env.example .env
          {
            echo '### Module imports'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import importlib, pkgutil, sys
          import yuyu

          failed = []
          for mod in pkgutil.walk_packages(yuyu.__path__, prefix="yuyu."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")

          if failed:
              print(f"{len(failed)} module(s) failed to import:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("all modules import cleanly")
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when imports failed
        if: steps.imports.outcome == 'failure'
        run: |
          echo "::error::Modules do not import - the package is not runnable. See the job summary."
          exit 1

      - name: config.json is valid JSON and has the documented shape
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          raw = Path("config.json").read_text(encoding="utf-8")
          try:
              cfg = json.loads(raw)
          except json.JSONDecodeError as exc:
              sys.exit(f"config.json is not valid JSON: {exc}")

          missing = [k for k in ("bot", "model", "memory", "context", "behavior") if k not in cfg]
          if missing:
              sys.exit(f"config.json is missing documented sections: {', '.join(missing)}")

          if not cfg["model"].get("providers"):
              sys.exit("config.json has no model.providers entries")

          ids = [p.get("id") for p in cfg["model"]["providers"]]
          dupes = {i for i in ids if ids.count(i) > 1}
          if dupes:
              # Duplicate ids make two models cool each other down, which breaks
              # the failover pool. See README, "The free-model pool".
              sys.exit(f"config.json has duplicate provider ids: {', '.join(sorted(dupes))}")

          print(f"config.json ok - {len(ids)} providers, all ids unique")
          PY