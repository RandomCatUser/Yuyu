name: Labels

# Creates and repairs the label set. Runs manually, and weekly, because labels
# get deleted by hand and PRs then arrive unlabelled and unsearchable.
#
# The list itself is .github/labels.json - one file, read by this workflow and
# by the PR workflow, so a label added in one place is real in both.

on:
  workflow_dispatch:
  schedule:
    # Sundays 04:31 UTC.
    - cron: '31 4 * * 0'

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update labels
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');

            const labels = JSON.parse(
              readFileSync('.github/labels.json', 'utf8')
            );

            let created = 0;
            let updated = 0;
            const failures = [];

            for (const { name, color, description } of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
                created += 1;
              } catch (createError) {
                // Already exists. createLabel is not an upsert - it 422s - so
                // repair it instead, otherwise a wrong colour or a stale
                // description stays wrong forever.
                if (createError.status !== 422) {
                  failures.push(`${name}: ${createError.message}`);
                  continue;
                }
                try {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    new_name: name,
                    color,
                    description,
                  });
                  updated += 1;
                } catch (updateError) {
                  failures.push(`${name}: ${updateError.message}`);
                }
              }
            }

            core.info(`${created} created, ${updated} updated, ${failures.length} failed.`);
            if (failures.length) {
              core.setFailed(failures.join('; '));
            }