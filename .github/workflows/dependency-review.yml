name: Dependency Review

# Fails a pull request that adds a dependency with a known vulnerability. This
# is the check that stops a bad transitive dependency landing via a requirements
# bump - the failure mode where nothing in the repo's own code changed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          # Only complain about things going in, not about drift in what is
          # already there - otherwise every PR fails on pre-existing advisories
          # and the signal gets ignored.
          fail-on-severity: high
          comment-summary-in-pr: on-failure