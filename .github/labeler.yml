# Auto-applied to pull requests based on which paths they touch. Keeps the
# label list honest without asking anyone to remember it.
#
# Paired with .github/labels.yml, which creates these labels if they are missing.

area:
  - changed-files:
      - 'yuyu/dashboard/**'
    labels: ['area: dashboard']
  - changed-files:
      - 'yuyu/providers.py'
      - 'yuyu/chat.py'
    labels: ['area: model providers']
  - changed-files:
      - 'yuyu/memory.py'
      - 'yuyu/context.py'
      - 'memory/**'
    labels: ['area: memory']
  - changed-files:
      - 'yuyu/affinity.py'
      - 'yuyu/feelings.py'
      - 'yuyu/bond.py'
      - 'affinity/**'
    labels: ['area: affect']
  - changed-files:
      - 'yuyu/reset.py'
      - 'backups/**'
    labels: ['area: reset & backups']
  - changed-files:
      - 'yuyu/skills.py'
      - 'skills/**'
      - 'persona.md'
    labels: ['area: persona & skills']
  - changed-files:
      - 'yuyu/formatting.py'
      - 'yuyu/stickers.py'
      - 'stickers.json'
    labels: ['area: output & emoji']
  - changed-files:
      - 'main.py'
      - 'yuyu/commands/**'
    labels: ['area: bot core']
  - changed-files:
      - 'tests/**'
    labels: ['area: tests']

component:
  - changed-files:
      - '.github/**'
    labels: ['ci']
  - changed-files:
      - 'requirements.txt'
      - 'requirements-dev.txt'
    labels: ['dependencies', 'python']
  - changed-files:
      - 'config.json'
      - 'yuyu/config.py'
      - '.env.example'
    labels: ['area: config']
  - changed-files:
      - 'README.md'
    labels: ['documentation']